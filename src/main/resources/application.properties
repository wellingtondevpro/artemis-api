spring.application.name=api

# Configuração Spring AI para IA Local (Ollama)
# URL padrão do Ollama rodando localmente
spring.ai.ollama.base-url=http://localhost:11434

# Qual modelo local você quer usar? (Ex: llama3, mistral, phi3)
spring.ai.ollama.chat.options.model=llama3.2:3b

# --- INTEGRAÇÃO CLOUD (DEEPSEEK) ---
# Cole a sua chave do DeepSeek aqui (ou passe como variável de ambiente DEEPSEEK_API_KEY)
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:SUA_CHAVE_AQUI}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-chat
# Endpoints dos Servidores MCP (separados por vírgula)
mcp.servers.urls=${MCP_SERVERS:http://localhost:8082,http://localhost:8083,http://localhost:8086}
